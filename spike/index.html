<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Escapement spike</title>
<style>
  body { margin: 0; font: 13px ui-monospace, monospace; background: #f6f6f4; color: #222; display: grid; grid-template-rows: 1fr auto; height: 100vh }
  #stage { display: grid; place-items: center; padding: 12px }
  #stage svg { height: 100%; max-height: calc(100vh - 70px); width: auto }
  #controls { display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-top: 1px solid #ddd; background: #fff }
  #scrub { flex: 1 }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="controls">
    <button id="play">Pause</button>
    <button id="step">Step</button>
    <label>speed <select id="speed">
      <option value="1">real time</option>
      <option value="0.2">1/5</option>
      <option value="0.05">1/20</option>
      <option value="0.01">1/100</option>
    </select></label>
    <input id="scrub" type="range" min="0" max="1" step="0.0005" value="0" />
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
